name: Android emulator regression

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-emulator-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chrome-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Enable KVM access
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Run API 36 Chrome regressions
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048
          emulator-options: >-
            -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect
            -no-snapshot
          script: bash scripts/ci-android-emulator.sh
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
