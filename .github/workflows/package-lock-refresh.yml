name: Package lock refresh
on:
  push:
    branches:
      - feature/sandbox-sync-integrity
    paths:
      - package.json
      - .github/workflows/package-lock-refresh.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm test
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git commit -m "deps: refresh lockfile for jsdom 29.1.1"
          git push
