# .github/workflows/sandbox-snapshot.yml
name: Sandbox source snapshot
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Pack tracked source
        run: git archive --format=tar.gz --output=sandbox-source.tgz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-source-${{ github.sha }}
          path: sandbox-source.tgz
          retention-days: 30
          compression-level: 0
