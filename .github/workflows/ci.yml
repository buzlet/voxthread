name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify development bundle reproducibility
        run: |
          npm run build:dev
          cp dist/voxthread-dev.js /tmp/voxthread-dev.js
          npm run build:dev
          cmp /tmp/voxthread-dev.js dist/voxthread-dev.js
      - name: Verify production userscript and reproducibility
        run: |
          npm run build:userscript
          npm run verify:userscript
          cp dist/voxthread.user.js /tmp/voxthread.user.js
          npm run build:userscript
          cmp /tmp/voxthread.user.js dist/voxthread.user.js
