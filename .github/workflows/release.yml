name: Release userscript

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'CHANGELOG.md'
      - 'package.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  tag-current-version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Create immutable package-version tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$(node -p "require('./package.json').version")"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            TARGET="$(git rev-list -n 1 "$TAG")"
            CHANGED="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"

            if printf '%s\n' "$CHANGED" | grep -Eq '^(CHANGELOG\.md|package\.json)$' && [ "$TARGET" != "$GITHUB_SHA" ]; then
              echo "Tag $TAG already exists at $TARGET. Bump package.json before preparing another release." >&2
              exit 1
            fi

            echo "Immutable tag $TAG already exists at $TARGET; it will not be moved."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" "$GITHUB_SHA" -m "VoxThread $TAG"
          git push origin "refs/tags/$TAG"
          echo "Created $TAG at $GITHUB_SHA"

  release:
    needs: tag-current-version
    if: >-
      always() &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.tag-current-version.result == 'success'
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Resolve and checkout immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            TAG='${{ inputs.tag }}'
          elif [[ '${{ github.ref }}' == refs/tags/v* ]]; then
            TAG='${{ github.ref_name }}'
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi

          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git checkout --detach "$TAG"
          echo "VOXTHREAD_TAG=$TAG" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Verify tag matches package version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "$VOXTHREAD_TAG" = "v$VERSION" || {
            echo "Tag $VOXTHREAD_TAG does not match package.json version $VERSION" >&2
            exit 1
          }
      - run: npm test
      - run: npm run build:userscript
      - run: npm run verify:userscript
      - name: Verify build is reproducible
        run: |
          cp dist/voxthread.user.js /tmp/voxthread.user.js
          npm run build:userscript
          cmp /tmp/voxthread.user.js dist/voxthread.user.js
      - name: Create checksum
        run: |
          cd dist
          sha256sum voxthread.user.js > voxthread.user.js.sha256
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VOXTHREAD_TAG" >/dev/null 2>&1; then
            gh release upload "$VOXTHREAD_TAG" \
              dist/voxthread.user.js \
              dist/voxthread.user.js.sha256 \
              --clobber
          else
            gh release create "$VOXTHREAD_TAG" \
              dist/voxthread.user.js \
              dist/voxthread.user.js.sha256 \
              --verify-tag \
              --generate-notes \
              --title "VoxThread $VOXTHREAD_TAG"
          fi
