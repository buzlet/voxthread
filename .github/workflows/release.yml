name: Release userscript

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG='${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}'
          VERSION="$(node -p "require('./package.json').version")"
          test "$TAG" = "v$VERSION" || {
            echo "Tag $TAG does not match package.json version $VERSION" >&2
            exit 1
          }
          echo "VOXTHREAD_TAG=$TAG" >> "$GITHUB_ENV"
      - run: npm test
      - run: npm run build:userscript
      - run: npm run verify:userscript
      - name: Verify build is reproducible
        run: |
          cp dist/voxthread.user.js /tmp/voxthread.user.js
          npm run build:userscript
          cmp /tmp/voxthread.user.js dist/voxthread.user.js
      - name: Create checksum
        run: |
          cd dist
          sha256sum voxthread.user.js > voxthread.user.js.sha256
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VOXTHREAD_TAG" >/dev/null 2>&1; then
            gh release upload "$VOXTHREAD_TAG" \
              dist/voxthread.user.js \
              dist/voxthread.user.js.sha256 \
              --clobber
          else
            gh release create "$VOXTHREAD_TAG" \
              dist/voxthread.user.js \
              dist/voxthread.user.js.sha256 \
              --verify-tag \
              --generate-notes \
              --title "VoxThread $VOXTHREAD_TAG"
          fi
