name: Release userscript

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'CHANGELOG.md'
      - 'package.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  tag-current-version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Create immutable package-version tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$(node -p "require('./package.json').version")"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            TARGET="$(git rev-list -n 1 "$TAG")"
            test "$TARGET" = "$GITHUB_SHA" || {
              echo "Tag $TAG already exists at $TARGET, refusing to move immutable release tag to $GITHUB_SHA" >&2
              exit 1
            }
            echo "Tag $TAG already points to this commit."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" "$GITHUB_SHA" -m "VoxThread $TAG"
          git push origin "refs/tags/$TAG"
          echo "Created $TAG at $GITHUB_SHA"

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG='${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}'
          VERSION="$(node -p "require('./package.json').version")"
          test "$TAG" = "v$VERSION" || {
            echo "Tag $TAG does not match package.json version $VERSION" >&2
            exit 1
          }
          echo "VOXTHREAD_TAG=$TAG" >> "$GITHUB_ENV"
      - run: npm test
      - run: npm run build:userscript
      - run: npm run verify:userscript
      - name: Verify build is reproducible
        run: |
          cp dist/voxthread.user.js /tmp/voxthread.user.js
          npm run build:userscript
          cmp /tmp/voxthread.user.js dist/voxthread.user.js
      - name: Create checksum
        run: |
          cd dist
          sha256sum voxthread.user.js > voxthread.user.js.sha256
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VOXTHREAD_TAG" >/dev/null 2>&1; then
            gh release upload "$VOXTHREAD_TAG" \
              dist/voxthread.user.js \
              dist/voxthread.user.js.sha256 \
              --clobber
          else
            gh release create "$VOXTHREAD_TAG" \
              dist/voxthread.user.js \
              dist/voxthread.user.js.sha256 \
              --verify-tag \
              --generate-notes \
              --title "VoxThread $VOXTHREAD_TAG"
          fi
