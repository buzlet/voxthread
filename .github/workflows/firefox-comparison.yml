name: Firefox Android comparison

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/firefox-comparison.yml'
      - 'scripts/emulator-browser-tts-comparison.mjs'
      - 'src/**'

permissions:
  contents: read

concurrency:
  group: firefox-android-comparison-${{ github.ref }}
  cancel-in-progress: true

env:
  FIREFOX_VERSION: '154.0.1'

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Restore Firefox APK cache
        id: firefox-cache
        uses: actions/cache@v4
        with:
          path: /tmp/firefox-${{ env.FIREFOX_VERSION }}.apk
          key: fenix-x86_64-${{ env.FIREFOX_VERSION }}
      - name: Download pinned Firefox Android APK
        if: steps.firefox-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          URL="https://archive.mozilla.org/pub/fenix/releases/$FIREFOX_VERSION/android/fenix-$FIREFOX_VERSION-android-x86_64/fenix-$FIREFOX_VERSION.multi.android-x86_64.apk"
          curl -fL --retry 3 --retry-delay 3 "$URL" -o "/tmp/firefox-$FIREFOX_VERSION.apk"
      - name: Enable KVM access
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Compare Chrome and Firefox reader TTS
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048
          emulator-options: >-
            -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect
            -no-snapshot
          script: |
            adb shell pm disable-user --user 0 com.android.vending >/dev/null 2>&1 || true
            adb shell pm grant com.android.chrome android.permission.POST_NOTIFICATIONS >/dev/null 2>&1 || true
            adb install -r "/tmp/firefox-$FIREFOX_VERSION.apk"
            adb shell am set-debug-app --persistent com.android.chrome
            adb shell 'echo "chrome --disable-fre --no-default-browser-check --no-first-run --skip_first_run_ui --disable-features=Translate" > /data/local/tmp/chrome-command-line'
            adb shell am force-stop com.android.chrome
            node scripts/emulator-browser-tts-comparison.mjs
      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-android-comparison-${{ github.run_id }}
          path: artifacts/browser-tts-comparison.json
          if-no-files-found: ignore
          retention-days: 14
