# .github/workflows/integrity.yml
name: Repository integrity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: git diff --check HEAD^ HEAD || git diff --check
      - run: python3 -m py_compile tools/github_sparse_sync.py
      - run: npm ci
      - run: npm test
      - run: npm run build:dev
      - run: npm run build:userscript
      - run: npm run verify:userscript
